spring.application.name=SpringBootProject
server.port=2000

# PostgreSQL Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgresdb:5432/klustudentdb
#postgresdb is the service name not the conatiner name
#klustudentdb is the database name
spring.datasource.username=postgres
spring.datasource.password=docker
#postgtres is the username and docker is the password which WE ARE USING IN DOCKER 

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
